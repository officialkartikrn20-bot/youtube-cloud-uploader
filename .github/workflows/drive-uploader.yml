name: YouTube Multi Uploader

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Google Drive video File ID"
        required: true
        type: string

      title:
        description: "YouTube video title"
        required: true
        type: string

      description:
        description: "YouTube video description"
        required: false
        type: string
        default: ""

      privacy:
        description: "Privacy status"
        required: true
        type: choice
        options:
          - private
          - unlisted
          - public
        default: private

jobs:
  uploader:
    runs-on: ubuntu-latest

    # Put the secrets into env so they can be checked with if:
    env:
      YOUTUBE_REFRESH_TOKEN_1: ${{ secrets.YOUTUBE_REFRESH_TOKEN_1 }}
      YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
      YOUTUBE_REFRESH_TOKEN_3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_3 }}
      YOUTUBE_REFRESH_TOKEN_4: ${{ secrets.YOUTUBE_REFRESH_TOKEN_4 }}
      YOUTUBE_REFRESH_TOKEN_5: ${{ secrets.YOUTUBE_REFRESH_TOKEN_5 }}

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      # --------------------------------------------------
      # 4. Download video from Google Drive
      # --------------------------------------------------
      - name: Download video from Google Drive
        env:
          DRIVE_FILE_ID: ${{ inputs.drive_file_id }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |

          cat > download_drive.py <<'PY'

          import os
          import sys

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload


          file_id = os.environ["DRIVE_FILE_ID"]

          google_client_id = os.environ["GOOGLE_CLIENT_ID"]
          google_client_secret = os.environ["GOOGLE_CLIENT_SECRET"]
          google_refresh_token = os.environ["GOOGLE_REFRESH_TOKEN"]


          credentials = Credentials(
              token=None,
              refresh_token=google_refresh_token,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=google_client_id,
              client_secret=google_client_secret,
              scopes=[
                  "https://www.googleapis.com/auth/drive.readonly"
              ]
          )


          drive = build(
              "drive",
              "v3",
              credentials=credentials
          )


          print("Getting Google Drive file information...")


          metadata = drive.files().get(
              fileId=file_id,
              fields="name,mimeType,size"
          ).execute()


          filename = metadata["name"]
          mime_type = metadata.get("mimeType", "")

          print(f"File name: {filename}")
          print(f"MIME type: {mime_type}")


          # Google Workspace files cannot be downloaded directly
          if mime_type.startswith("application/vnd.google-apps."):
              print(
                  "ERROR: This is a Google Workspace file. "
                  "Please provide a normal video file such as MP4."
              )
              sys.exit(1)


          print("Starting download...")


          request = drive.files().get_media(
              fileId=file_id
          )


          with open(filename, "wb") as file:

              downloader = MediaIoBaseDownload(
                  file,
                  request
              )

              done = False

              while not done:

                  status, done = downloader.next_chunk()

                  if status:

                      progress = int(
                          status.progress() * 100
                      )

                      print(
                          f"Download progress: {progress}%"
                      )


          print("")
          print(
              f"Downloaded successfully: {filename}"
          )

          PY

          python download_drive.py

      # --------------------------------------------------
      # 5. Upload to YouTube Channel 1
      # --------------------------------------------------
      - name: Upload to YouTube Channel 1
        if: ${{ env.YOUTUBE_REFRESH_TOKEN_1 != '' }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_1 }}

          VIDEO_TITLE: ${{ inputs.title }}
          VIDEO_DESCRIPTION: ${{ inputs.description }}
          PRIVACY: ${{ inputs.privacy }}

        run: |
          python upload_youtube.py


      # --------------------------------------------------
      # 6. Upload to YouTube Channel 2
      # --------------------------------------------------
      - name: Upload to YouTube Channel 2
        if: ${{ env.YOUTUBE_REFRESH_TOKEN_2 != '' }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}

          VIDEO_TITLE: ${{ inputs.title }}
          VIDEO_DESCRIPTION: ${{ inputs.description }}
          PRIVACY: ${{ inputs.privacy }}

        run: |
          python upload_youtube.py


      # --------------------------------------------------
      # 7. Upload to YouTube Channel 3
      # --------------------------------------------------
      - name: Upload to YouTube Channel 3
        if: ${{ env.YOUTUBE_REFRESH_TOKEN_3 != '' }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_3 }}

          VIDEO_TITLE: ${{ inputs.title }}
          VIDEO_DESCRIPTION: ${{ inputs.description }}
          PRIVACY: ${{ inputs.privacy }}

        run: |
          python upload_youtube.py


      # --------------------------------------------------
      # 8. Upload to YouTube Channel 4
      # --------------------------------------------------
      - name: Upload to YouTube Channel 4
        if: ${{ env.YOUTUBE_REFRESH_TOKEN_4 != '' }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_4 }}

          VIDEO_TITLE: ${{ inputs.title }}
          VIDEO_DESCRIPTION: ${{ inputs.description }}
          PRIVACY: ${{ inputs.privacy }}

        run: |
          python upload_youtube.py


      # --------------------------------------------------
      # 9. Upload to YouTube Channel 5
      # --------------------------------------------------
      - name: Upload to YouTube Channel 5
        if: ${{ env.YOUTUBE_REFRESH_TOKEN_5 != '' }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_5 }}

          VIDEO_TITLE: ${{ inputs.title }}
          VIDEO_DESCRIPTION: ${{ inputs.description }}
          PRIVACY: ${{ inputs.privacy }}

        run: |
          python upload_youtube.py
