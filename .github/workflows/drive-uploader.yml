name: YouTube Multi Uploader

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Google Drive video File ID"
        required: true
        type: string

      title:
        description: "YouTube video title"
        required: true
        type: string

      description:
        description: "YouTube video description"
        required: false
        type: string
        default: ""

      privacy:
        description: "Privacy status"
        required: true
        type: choice
        options:
          - private
          - unlisted
          - public
        default: private

jobs:
  uploader:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      - name: Download video from Google Drive
        env:
          DRIVE_FILE_ID: ${{ inputs.drive_file_id }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          cat > download_drive.py <<'PY'
          import os
          import io

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          file_id = os.environ["DRIVE_FILE_ID"]

          credentials = Credentials(
              None,
              refresh_token=os.environ["GOOGLE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["GOOGLE_CLIENT_ID"],
              client_secret=os.environ["GOOGLE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/drive.readonly"]
          )

          drive = build("drive", "v3", credentials=credentials)

          metadata = drive.files().get(
              fileId=file_id,
              fields="name,mimeType,size"
          ).execute()

          filename = metadata["name"]

          print(f"Downloading: {filename}")

          request = drive.files().get_media(fileId=file_id)

          with open(filename, "wb") as f:
              downloader = MediaIoBaseDownload(f, request)

              done = False

              while not done:
                  status, done = downloader.next_chunk()

                  if status:
                      print(
                          f"Download progress: "
                          f"{int(status.progress() * 100)}%"
                      )

          print(f"Downloaded successfully: {filename}")
          PY

          python download_drive.py

      - name: Upload to YouTube Channel 1
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_1 }}
          VIDEO_TITLE: ${{ inputs.title }}
          VIDEO_DESCRIPTION: ${{ inputs.description }}
          PRIVACY: ${{ inputs.privacy }}
        run: |
          python upload_youtube.py

      - name: Upload to YouTube Channel 2
        if: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 != '' }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          VIDEO_TITLE: ${{ inputs.title }}
          VIDEO_DESCRIPTION: ${{ inputs.description }}
          PRIVACY: ${{ inputs.privacy }}
        run: |
          python upload_youtube.py

      - name: Upload to YouTube Channel 3
        if: ${{ secrets.YOUTUBE_REFRESH_TOKEN_3 != '' }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_3 }}
          VIDEO_TITLE: ${{ inputs.title }}
          VIDEO_DESCRIPTION: ${{ inputs.description }}
          PRIVACY: ${{ inputs.privacy }}
        run: |
          python upload_youtube.py

      - name: Upload to YouTube Channel 4
        if: ${{ secrets.YOUTUBE_REFRESH_TOKEN_4 != '' }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_4 }}
          VIDEO_TITLE: ${{ inputs.title }}
          VIDEO_DESCRIPTION: ${{ inputs.description }}
          PRIVACY: ${{ inputs.privacy }}
        run: |
          python upload_youtube.py

      - name: Upload to YouTube Channel 5
        if: ${{ secrets.YOUTUBE_REFRESH_TOKEN_5 != '' }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_5 }}
          VIDEO_TITLE: ${{ inputs.title }}
          VIDEO_DESCRIPTION: ${{ inputs.description }}
          PRIVACY: ${{ inputs.privacy }}
        run: |
          python upload_youtube.py
